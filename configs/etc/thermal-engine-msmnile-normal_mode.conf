# thermal-engine-msmnile-normal_mode.conf
# Corrected for raphael (K20 Pro / SM8150)
#
# Verified cooling devices (from cdev enumeration):
#   cdev0:  thermal-devfreq-0  (DDR devfreq)
#   cdev1:  npu
#   cdev2:  thermal-cpufreq-0  (cpu0 - Silver)
#   cdev3:  thermal-cpufreq-1  (cpu1 - Silver)
#   cdev4:  thermal-cpufreq-2  (cpu2 - Silver)
#   cdev5:  thermal-cpufreq-3  (cpu3 - Silver)
#   cdev6:  thermal-cpufreq-4  (cpu4 - Gold)
#   cdev7:  thermal-cpufreq-5  (cpu5 - Gold)
#   cdev8:  thermal-cpufreq-6  (cpu6 - Gold)
#   cdev9:  thermal-cpufreq-7  (cpu7 - Gold+)
#   cdev10: ebi
#   cdev11: cx
#   cdev12: mx-cdev-lvl
#   cdev13: mm-cx-cdev-lvl
#   cdev14: battery
#   cdev15: panel0-backlight
#   cdev16: cdsp
#   cdev17: hvx
#   cdev18: cdsp_vdd
#   cdev19: adsp_vdd
#   cdev20: slpi_vdd
#   cdev21: modem0_pa
#   cdev22: modem0_proc
#   cdev23: modem0_vdd
#   cdev24: modem0_current
#   cdev25: modem0_skin
#
# Verified thermal sensors (from tz-by-name):
#   sdm-therm        - skin temperature (NTC on back of device)
#   sdm-therm-monitor - monitored skin sensor for thermal HAL
#   quiet_therm      - quiet/ambient thermistor
#   usbc-therm-monitor - USB-C connector temperature
#   battery          - battery temperature
#   xo_therm         - crystal oscillator temperature
#   pa_therm0/1      - PA thermistors
#   npu-usr          - NPU junction temperature
#   gpuss-0-usr      - GPU SS temperature
#
# NOTE: bcl-virt-monitor does NOT exist on this kernel build.
# NOTE: speaker_cal device is not available - speaker_cal section removed.
# NOTE: ss (subsystem) thermal zones use modem0_* cooling devices.

[SS-SKIN-GPU]
algo_type           ss
sampling            2000
sensor              sdm-therm
device              gpu
set_point           54000
set_point_clr       52000
device_max_limit    615000000
time_constant       0

[SKIN-MONITOR]
algo_type       monitor
sampling        2000
sensor          sdm-therm
thresholds      48000   50000           52000           54000           57000
thresholds_clr  47000   49000           51000           53000           56000
actions         cpu7    cpu4+cpu7       cpu4+cpu7       cpu4+cpu7       cpu4+cpu7
action_info     2841600 2323200+2745600 1804800+1804800 1708800+1708800 1612800+1612800

[BATTERY-SKIN-VIRTUAL]
algo_type               virtual
trip_sensor             quiet_therm
sensors                 quiet_therm battery
set_point               37000
set_point_clr           29000
sampling                1000
weights
math                    2

[BATTERY-MONITOR]
algo_type           monitor
sampling            2000
sensor              BATTERY-SKIN-VIRTUAL
thresholds          38000        40000        42000        44000        46000        48000        50000        55000
thresholds_clr      30000        38000        40000        42000        44000        46000        48000        50000
actions             battery      battery      battery      battery      battery      battery      battery      battery
action_info         8            9            10           12           13           14           15           16

[MODEM-MONITOR]
algo_type           monitor
sampling            1000
sensor              sdm-therm
thresholds          49000               52000               54000
thresholds_clr      46000               50000               52000
actions             modem0_pa+modem0_proc    modem0_pa+modem0_proc    modem0_pa+modem0_proc
action_info         1+1                 1+2                 3+3

[XO-MONITOR]
algo_type           monitor
sampling            2000
sensor              xo_therm
thresholds          55000       60000       65000
thresholds_clr      52000       57000       62000
actions             cpu7        cpu4+cpu7   cpu4+cpu7
action_info         1920000     1612800+1920000 1286400+1612800

[PA-MONITOR]
algo_type           monitor
sampling            2000
sensor              pa_therm0
thresholds          55000       60000
thresholds_clr      52000       57000
actions             modem0_pa+modem0_proc    modem0_pa+modem0_proc
action_info         1+1                 2+2
