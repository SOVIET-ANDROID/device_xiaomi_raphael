# thermal-engine-msmnile-normal_mode.conf
# Xiaomi Raphael (SM8150 / 855 & 855+) — Pixel thermal HAL
#
# All sensors and cdevs verified on device.
# Throttle freqs based on measured per-core power data (results.json).
#
# Cooling device names (exact, from cdev-by-name):
#   cpu4-6        = thermal-cpufreq-4/5/6  (Gold,  max_state=17)
#   cpu7          = thermal-cpufreq-7      (Prime, max_state=20)
#   gpu           = thermal-devfreq-0      (GPU,   max_state=5)
#   battery       = battery                        (max_state=16)
#   backlight     = panel0-backlight               (max_state=4095)
#   ebi           = ebi                            (max_state=1, binary)
#   modem PA      = modem0_pa                      (max_state=3)
#   modem proc    = modem0_proc                    (max_state=3)
#
# GPU pwrlevels (speed_bin=1, running table):
#   level 0 = 770 MHz  level 1 = 715 MHz  level 2 = 615 MHz
#   level 3 = 515 MHz  level 4 = 345 MHz  level 5 = off

# ---------------------------------------------------------------------------
# Virtual blended sensor: skin temp (sdm-therm) weighted 3x over battery
# Prevents transient battery spikes from causing unnecessary CPU throttle
# ---------------------------------------------------------------------------
[BATTERY-SKIN-VIRTUAL]
algo_type       virtual
trip_sensor     sdm-therm
sensors         sdm-therm       battery
set_point       37000
set_point_clr   29000
sampling        1000
weights         3               1
math            2

# ---------------------------------------------------------------------------
# CPU steady-state governors
# Prime (cpu7): capped at 2419 MHz — avoids the 2419→2534 cliff (+104 mW)
# Gold  (cpu4-6): capped at 2323 MHz — avoids the 2323→2419 cliff (+78 mW/core)
# ---------------------------------------------------------------------------
[SS-SKIN-CPU7]
algo_type           ss
sampling            500
sensor              sdm-therm
device              thermal-cpufreq-7
set_point           42000
set_point_clr       40000
device_max_limit    2419200
time_constant       0

[SS-SKIN-CPU4]
algo_type           ss
sampling            500
sensor              sdm-therm
device              thermal-cpufreq-4
set_point           44000
set_point_clr       42000
device_max_limit    2323200
time_constant       0

[SS-SKIN-CPU5]
algo_type           ss
sampling            500
sensor              sdm-therm
device              thermal-cpufreq-5
set_point           44000
set_point_clr       42000
device_max_limit    2323200
time_constant       0

[SS-SKIN-CPU6]
algo_type           ss
sampling            500
sensor              sdm-therm
device              thermal-cpufreq-6
set_point           44000
set_point_clr       42000
device_max_limit    2323200
time_constant       0

# ---------------------------------------------------------------------------
# GPU steady-state
# Capped at 615 MHz (pwrlevel 2) — valid for both 855 and 855+ tables
# ---------------------------------------------------------------------------
[SS-SKIN-GPU]
algo_type           ss
sampling            2000
sensor              sdm-therm
device              thermal-devfreq-0
set_point           54000
set_point_clr       52000
device_max_limit    615000000
time_constant       0

# ---------------------------------------------------------------------------
# Skin temp monitor — stepped CPU freq reduction
# Steps land below measured power cliffs (from results.json):
#   48°C: Prime → 2419 MHz (727 mW)
#   50°C: Gold → 2016 MHz (1707 mW total),  Prime → 2227 MHz (629 mW)
#   52°C: Gold → 1804 MHz (1416 mW total),  Prime → 2016 MHz (535 mW)
#   54°C: Gold → 1612 MHz (1161 mW total),  Prime → 1804 MHz (457 mW)
#   57°C: Gold → 1286 MHz ( 900 mW total),  Prime → 1401 MHz (372 mW) — emergency
# ---------------------------------------------------------------------------
[SKIN-MONITOR]
algo_type       monitor
sampling        2000
sensor          sdm-therm
thresholds      48000   50000                                           52000                                           54000                                           57000
thresholds_clr  47000   49000                                           51000                                           53000                                           56000
actions         thermal-cpufreq-7   thermal-cpufreq-4+thermal-cpufreq-5+thermal-cpufreq-6+thermal-cpufreq-7   thermal-cpufreq-4+thermal-cpufreq-5+thermal-cpufreq-6+thermal-cpufreq-7   thermal-cpufreq-4+thermal-cpufreq-5+thermal-cpufreq-6+thermal-cpufreq-7   thermal-cpufreq-4+thermal-cpufreq-5+thermal-cpufreq-6+thermal-cpufreq-7
action_info     2419200             2016000+2016000+2016000+2227200                         1804800+1804800+1804800+2016000                         1612800+1612800+1612800+1804800                         1286400+1286400+1286400+1401600

# ---------------------------------------------------------------------------
# GPU stepped monitor — 4 levels matching actual pwrlevel table
#   43°C → level 1 (715 MHz)   50°C → level 2 (615 MHz)
#   54°C → level 3 (515 MHz)   57°C → level 4 (345 MHz)
# ---------------------------------------------------------------------------
[GPU-MONITOR]
algo_type       monitor
sampling        2000
sensor          sdm-therm
thresholds      43000   50000   54000   57000
thresholds_clr  41000   48000   52000   55000
actions         thermal-devfreq-0   thermal-devfreq-0   thermal-devfreq-0   thermal-devfreq-0
action_info     1                   2                   3                   4

# ---------------------------------------------------------------------------
# Battery charge rate limiting (10 steps via blended sensor)
# max_state=16 — action_info maxes at 16 ✓
# ---------------------------------------------------------------------------
[BATTERY-MONITOR]
algo_type       monitor
sampling        2000
sensor          BATTERY-SKIN-VIRTUAL
thresholds      38000   40000   42000   44000   46000   48000   50000   52000   54000   55000
thresholds_clr  30000   38000   40000   42000   44000   46000   48000   50000   52000   54000
actions         battery battery battery battery battery battery battery battery battery battery
action_info     8       9       10      12      13      14      15      15      16      16

# ---------------------------------------------------------------------------
# Backlight dimming at sustained high skin temp
# panel0-backlight max_state=4095 — action_info 1536 is well within range ✓
# ---------------------------------------------------------------------------
[SKIN-BACKLIGHT-MONITOR]
algo_type       monitor
sampling        2000
sensor          sdm-therm
thresholds      55000
thresholds_clr  53000
actions         panel0-backlight
action_info     1536

# ---------------------------------------------------------------------------
# Modem throttle
# modem0_pa and modem0_proc max_state=3 — max action_info used is 3 ✓
# ---------------------------------------------------------------------------
[MODEM-MONITOR]
algo_type       monitor
sampling        1000
sensor          sdm-therm
thresholds      49000                       52000                       54000
thresholds_clr  46000                       50000                       52000
actions         modem0_pa+modem0_proc       modem0_pa+modem0_proc       modem0_pa+modem0_proc
action_info     1+1                         1+2                         3+3

# ---------------------------------------------------------------------------
# BCL — freq cap on low battery SoC
# Caps Gold at 1497 MHz (last step before the +135 mW power cliff)
# soc sensor returns raw % (0-100), threshold 5 = 5% SoC
# reverse=1: triggers when SoC DROPS below threshold
# ---------------------------------------------------------------------------
[BCL-MONITOR]
algo_type       monitor
sampling        1000
sensor          soc
thresholds      5
thresholds_clr  6
actions         thermal-cpufreq-4+thermal-cpufreq-5+thermal-cpufreq-6
action_info     1497600+1497600+1497600
reverse         1

# ---------------------------------------------------------------------------
# USB port overtemp — cut charge current at 60°C
# ---------------------------------------------------------------------------
[USB-MONITOR]
algo_type       monitor
sampling        1000
sensor          usbc-therm-monitor
thresholds      60000
thresholds_clr  55000
actions         battery
action_info     16
